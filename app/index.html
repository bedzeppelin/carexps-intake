<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3757D8">
<meta name="robots" content="noindex, nofollow">
<title>Patient Intake — CareXPS Urgent Care</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/carexps-logo.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <img class="topbar__logo" src="assets/carexps-logo.png" alt="CareXPS Urgent Care">
    <div class="topbar__meta" id="topbar-meta" hidden>
      <div class="topbar__counter" id="step-counter"></div>
      <div class="topbar__label" id="step-label"></div>
    </div>
    <div class="topbar__spacer" aria-hidden="true"></div>
  </div>
  <div class="progress" id="progress" role="progressbar" hidden></div>
</header>

<main class="main" id="screen"></main>

<footer class="footer" id="footer" hidden>
  <div class="footer__inner">
    <button type="button" class="btn-secondary" id="btn-back">Back</button>
    <button type="button" class="btn-primary" id="btn-next">Continue</button>
  </div>
</footer>

<noscript>
  <p style="max-width:640px;margin:40px auto;padding:0 20px;font-family:system-ui,sans-serif">
    This intake form needs JavaScript enabled. Please let a member of our front desk
    staff know and they will check you in.
  </p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
