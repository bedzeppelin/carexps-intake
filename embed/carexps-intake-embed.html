<!-- CareXPS intake form — paste this into a Lovable custom-HTML block.
     Replace INTAKE_URL with wherever the form is hosted. -->

<div id="carexps-intake" style="max-width:820px;margin:0 auto"></div>

<script>
(function () {
  var INTAKE_URL = 'https://intake.example.ca/';   // <-- change this
  var CHANNEL = 'carexps-intake';

  var mount = document.getElementById('carexps-intake');
  var frame = document.createElement('iframe');

  frame.src = INTAKE_URL + '?mode=remote';
  frame.title = 'CareXPS patient intake form';
  frame.loading = 'lazy';
  frame.style.cssText = 'width:100%;border:0;display:block;height:900px;transition:height .2s ease';
  // The form only ever needs the camera, for the optional health-card photo.
  frame.allow = 'camera';
  // Belt and braces: the form is same-site content, but there is no reason for
  // it to be able to navigate the parent page or open popups.
  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-downloads');

  mount.appendChild(frame);

  window.addEventListener('message', function (event) {
    // Accept height updates only from the frame we created, on our own channel.
    if (event.source !== frame.contentWindow) return;
    var data = event.data;
    if (!data || data.channel !== CHANNEL) return;
    if (data.type === 'height' && typeof data.height === 'number') {
      frame.style.height = Math.max(500, Math.min(data.height + 8, 20000)) + 'px';
    }
  });
})();
</script>
