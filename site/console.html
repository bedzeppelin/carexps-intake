<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareXPS Staff Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<header class="bar">
  <div class="wrap bar-inner">
    <a class="bar-brand" href="index.html">
      <span class="bar-mark">CareXPS</span>
      <span class="bar-name">Staff Console</span>
    </a>
    <nav class="bar-nav">
      <a href="form/?mode=demo&amp;nosw=1">Patient form</a>
      <a href="docs.html">Documentation</a>
    </nav>
  </div>
</header>

<main class="wrap page">

  <div class="page-head">
    <h1>Submitted forms</h1>
    <p class="sub" id="count">Loading…</p>
  </div>

  <div class="banner" id="banner" hidden></div>

  <div class="toolbar">
    <label class="check">
      <input type="checkbox" id="selectAll">
      <span id="selectLabel">Select all</span>
    </label>
    <div class="toolbar-actions">
      <button class="btn" type="button" id="dlPdf">Download PDFs</button>
      <button class="btn" type="button" id="dlCsv">Download CSV</button>
      <button class="btn btn-primary" type="button" id="dlAll">Download everything</button>
      <button class="btn btn-danger" type="button" id="deleteSelected">Delete</button>
    </div>
  </div>

  <div class="table-scroll">
    <table id="table">
      <thead>
        <tr>
          <th class="col-check"><span class="sr">Select</span></th>
          <th>Patient</th>
          <th>Health number</th>
          <th>Submitted</th>
          <th>Arrival</th>
          <th>Type</th>
          <th class="col-actions"><span class="sr">Actions</span></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <p class="foot-note">
    Forms submitted on the <a href="form/?mode=demo&amp;nosw=1">patient form</a> appear here.
    <button class="link-btn" type="button" id="reset">Reset the demo</button>
  </p>

  <section class="detail" id="detail" hidden></section>

</main>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
import { toCsv, csvHeader, csvRow } from './form/js/exporters/csv.js';
import { toFhirBundle } from './form/js/exporters/fhir.js';
import { toClinicalNote } from './form/js/exporters/note.js';
import { receiptSections } from './form/js/exporters/receipt.js';
import { allSubmissions, removeMany, resetDemo, displayName, baseName, readSubmitted } from './js/store.js';
import { renderIntakePdf } from './js/pdf.js';
import { makeZip } from './js/zip.js';

const CLINIC = 'CareXPS Urgent Care';
const $ = s => document.querySelector(s);

let submissions = [];
let selected = new Set();
let openId = null;
let openTab = 'summary';

/* ── loading ───────────────────────────────────────────────── */

function load() {
  submissions = allSubmissions();
  // Drop selections for rows that no longer exist.
  selected = new Set([...selected].filter(id => submissions.some(s => s.meta.id === id)));
  render();
}

const byId = id => submissions.find(s => s.meta.id === id);
const chosen = () => submissions.filter(s => selected.has(s.meta.id));

const timeOf = sub => new Date(sub.meta.submittedAt)
  .toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' });

/* ── rendering ─────────────────────────────────────────────── */

function render() {
  const live = readSubmitted().length;
  $('#count').textContent = submissions.length === 1
    ? '1 form' + (live ? ' · 1 from the patient form' : '')
    : `${submissions.length} forms` + (live ? ` · ${live} from the patient form` : '');

  const tbody = $('#rows');
  tbody.textContent = '';

  if (!submissions.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 7;
    td.className = 'empty';
    td.textContent = 'No forms. Fill one in on the patient form, or reset the demo to bring the examples back.';
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  for (const sub of submissions) {
    const tr = document.createElement('tr');
    if (sub.meta.id === openId) tr.className = 'is-open';

    const tdCheck = document.createElement('td');
    tdCheck.className = 'col-check';
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = selected.has(sub.meta.id);
    box.setAttribute('aria-label', 'Select ' + displayName(sub));
    // Only the toolbar depends on what is ticked, so re-render that and leave
    // the rows alone. Rebuilding the table here would replace this very
    // checkbox and throw away keyboard focus on every toggle.
    box.addEventListener('change', () => {
      if (box.checked) selected.add(sub.meta.id); else selected.delete(sub.meta.id);
      syncToolbar();
    });
    tdCheck.appendChild(box);

    const tdName = document.createElement('td');
    tdName.className = 'cell-name';
    tdName.textContent = displayName(sub);
    if (!sub._seeded) {
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'New';
      tdName.appendChild(tag);
    }

    const tdHcn = document.createElement('td');
    tdHcn.className = 'mono';
    tdHcn.textContent = (sub.checkin && sub.checkin.ohip) || '—';

    const tdTime = document.createElement('td');
    tdTime.className = 'mono';
    tdTime.textContent = timeOf(sub);

    const tdArrival = document.createElement('td');
    const booked = sub.checkin && sub.checkin.appointment === 'yes';
    if (booked) {
      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = sub.checkin.appointmentTime
        ? 'Appt ' + sub.checkin.appointmentTime : 'Appointment';
      tdArrival.appendChild(pill);
    } else {
      tdArrival.textContent = sub.checkin && sub.checkin.appointment === 'no' ? 'Walk-in' : '—';
    }

    const tdType = document.createElement('td');
    tdType.textContent = sub.meta.pathway === 'quick' ? 'Quick check-in' : 'Full registration';

    const tdActions = document.createElement('td');
    tdActions.className = 'col-actions';
    const open = document.createElement('button');
    open.type = 'button';
    open.className = 'btn btn-sm';
    open.textContent = sub.meta.id === openId ? 'Close' : 'View';
    open.addEventListener('click', () => {
      openId = sub.meta.id === openId ? null : sub.meta.id;
      openTab = 'summary';
      render();
      if (openId) $('#detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'btn btn-sm btn-danger';
    del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete ' + displayName(sub));
    del.addEventListener('click', () => remove([sub], displayName(sub)));
    tdActions.append(open, del);

    tr.append(tdCheck, tdName, tdHcn, tdTime, tdArrival, tdType, tdActions);
    tbody.appendChild(tr);
  }

  syncToolbar();
  renderDetail();
}

function syncToolbar() {
  const all = $('#selectAll');
  all.checked = submissions.length > 0 && selected.size === submissions.length;
  all.indeterminate = selected.size > 0 && selected.size < submissions.length;
  $('#selectLabel').textContent = selected.size ? `${selected.size} selected` : 'Select all';

  for (const id of ['dlPdf', 'dlCsv', 'dlAll', 'deleteSelected']) {
    $('#' + id).disabled = selected.size === 0;
  }
  $('#deleteSelected').textContent = selected.size > 1 ? `Delete ${selected.size}` : 'Delete';
}

const TABS = [['summary', 'Summary'], ['note', 'Clinical note'], ['json', 'JSON'], ['csv', 'CSV'], ['fhir', 'FHIR R4']];

function exportText(sub, tab) {
  if (tab === 'note') return toClinicalNote(sub);
  if (tab === 'json') return JSON.stringify(strip(sub), null, 2);
  if (tab === 'csv') return csvHeader() + '\n' + csvRow(sub);
  return JSON.stringify(toFhirBundle(sub), null, 2);
}

function renderDetail() {
  const panel = $('#detail');
  const sub = openId ? byId(openId) : null;
  if (!sub) { panel.hidden = true; panel.textContent = ''; return; }

  panel.hidden = false;
  panel.textContent = '';

  const head = document.createElement('div');
  head.className = 'detail-head';
  const h2 = document.createElement('h2');
  h2.textContent = displayName(sub);
  const meta = document.createElement('p');
  meta.className = 'mono sub';
  meta.textContent = `${(sub.checkin && sub.checkin.ohip) || 'no health number'} · ${baseName(sub)}`;
  head.append(h2, meta);
  panel.appendChild(head);

  const actions = document.createElement('div');
  actions.className = 'detail-actions';
  actions.append(
    button('Download PDF', () => downloadPdf([sub])),
    button('Download CSV', () => save(baseName(sub) + '.csv', toCsv(sub))),
    button('Download JSON', () => save(baseName(sub) + '.json', JSON.stringify(strip(sub), null, 2)))
  );
  panel.appendChild(actions);

  const tabs = document.createElement('div');
  tabs.className = 'tabs';
  tabs.setAttribute('role', 'tablist');
  for (const [id, label] of TABS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(openTab === id));
    b.textContent = label;
    b.addEventListener('click', () => { openTab = id; renderDetail(); });
    tabs.appendChild(b);
  }
  panel.appendChild(tabs);

  const body = document.createElement('div');
  body.className = 'detail-body';

  if (openTab === 'summary') {
    for (const section of receiptSections(sub)) {
      const h3 = document.createElement('h3');
      h3.className = 'sec';
      h3.textContent = section.title;
      body.appendChild(h3);
      const dl = document.createElement('dl');
      dl.className = 'kv';
      for (const row of section.rows) {
        const dt = document.createElement('dt');
        dt.textContent = row.label;
        const dd = document.createElement('dd');
        dd.textContent = row.value;
        dl.append(dt, dd);
      }
      body.appendChild(dl);
    }
  } else {
    const pre = document.createElement('pre');
    pre.className = 'code';
    pre.textContent = exportText(sub, openTab);
    body.appendChild(pre);
  }

  panel.appendChild(body);
}

function button(label, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn';
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

/* ── exporting ─────────────────────────────────────────────── */

// Everything the console holds is derived from the submission, so the
// signature data URI is stripped from the JSON view only for readability.
function strip(sub) {
  const copy = JSON.parse(JSON.stringify(sub));
  delete copy._seeded;
  return copy;
}

function save(filename, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Downloaded ' + filename);
}

const today = () => new Date().toISOString().slice(0, 10);

async function buildPdfs(list) {
  const files = [];
  for (const sub of list) {
    const bytes = await renderIntakePdf(sub, { sections: receiptSections(sub), clinicName: CLINIC });
    files.push({ name: baseName(sub) + '.pdf', data: bytes });
  }
  return files;
}

async function downloadPdf(list) {
  try {
    const files = await buildPdfs(list);
    if (files.length === 1) {
      save(files[0].name, new Blob([files[0].data], { type: 'application/pdf' }));
      return;
    }
    save(`carexps-intake-pdfs-${today()}.zip`, makeZip(files));
  } catch (err) {
    toast('Could not build the PDF: ' + err.message);
  }
}

$('#dlPdf').addEventListener('click', () => downloadPdf(chosen()));

$('#dlCsv').addEventListener('click', () => {
  const list = chosen();
  // One file, one row per form — what a bulk loader expects.
  const csv = '﻿' + csvHeader() + '\r\n' + list.map(csvRow).join('\r\n') + '\r\n';
  save(`carexps-intake-${today()}.csv`, csv, 'text/csv;charset=utf-8');
});

$('#dlAll').addEventListener('click', async () => {
  const list = chosen();
  $('#dlAll').disabled = true;
  $('#dlAll').textContent = 'Building…';
  try {
    const files = await buildPdfs(list);
    files.push({
      name: `intake-${today()}.csv`,
      data: '﻿' + csvHeader() + '\r\n' + list.map(csvRow).join('\r\n') + '\r\n'
    });
    for (const sub of list) {
      files.push({ name: baseName(sub) + '.json', data: JSON.stringify(strip(sub), null, 2) });
      files.push({ name: baseName(sub) + '.txt', data: toClinicalNote(sub) });
    }
    save(`carexps-intake-${today()}.zip`, makeZip(files));
  } catch (err) {
    toast('Could not build the archive: ' + err.message);
  } finally {
    $('#dlAll').disabled = false;
    $('#dlAll').textContent = 'Download everything';
  }
});

/* ── wiring ────────────────────────────────────────────────── */

// Deleting is the one irreversible thing in here, so it always asks first and
// always names what is going.
function remove(list, label) {
  if (!list.length) return;
  const what = label || (list.length === 1 ? displayName(list[0]) : `${list.length} forms`);
  if (!confirm(`Delete ${what}? This cannot be undone.`)) return;
  const ids = list.map(s => s.meta.id);
  removeMany(ids);
  for (const id of ids) selected.delete(id);
  if (ids.includes(openId)) openId = null;
  load();
  toast(`Deleted ${what}.`);
}

$('#deleteSelected').addEventListener('click', () => remove(chosen()));

$('#selectAll').addEventListener('change', e => {
  selected = e.target.checked ? new Set(submissions.map(s => s.meta.id)) : new Set();
  render();
});

$('#reset').addEventListener('click', () => {
  if (!confirm('Reset the demo? Submitted forms are deleted and both examples come back.')) return;
  resetDemo();
  openId = null;
  selected = new Set();
  load();
  toast('Demo reset.');
});

function toast(message) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = message;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3800);
}

// A form submitted in another tab shows up here without a manual refresh.
window.addEventListener('storage', e => {
  if (e.key === 'carexps.demo.submissions') {
    load();
    const banner = $('#banner');
    banner.hidden = false;
    banner.textContent = 'A new form just arrived from the patient form.';
  }
});

load();
</script>
</body>
</html>
